<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        /* ---------- GAME WRAPPER ---------- */
        .game-wrapper {
            background: #111128;
            padding: 30px 40px 40px;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.08),
                inset 0 0 60px rgba(0, 200, 255, 0.02);
            border: 1px solid rgba(0, 200, 255, 0.06);
        }

        /* ---------- SCOREBOARD ---------- */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 18px 10px;
            color: #b0e0ff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
        }

        .scoreboard .score {
            display: flex;
            gap: 30px;
            font-size: 32px;
        }

        .scoreboard .score span {
            min-width: 50px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.4);
        }

        .scoreboard .divider {
            color: rgba(255, 255, 255, 0.08);
            font-size: 28px;
        }

        .score-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        /* ---------- CANVAS ---------- */
        canvas {
            display: block;
            width: 800px;
            height: 450px;
            border-radius: 16px;
            background: #0d0d24;
            box-shadow: inset 0 0 80px rgba(0, 50, 80, 0.15),
                0 0 40px rgba(0, 100, 200, 0.05);
            border: 1px solid rgba(0, 200, 255, 0.06);
            cursor: none;
        }

        /* ---------- CONTROLS INFO ---------- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .controls .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .controls .restart-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.15);
            padding: 6px 20px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls .restart-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.3);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 860px) {
            .game-wrapper {
                padding: 16px;
                border-radius: 16px;
            }
            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 800 / 450;
            }
            .scoreboard {
                font-size: 20px;
                padding-bottom: 12px;
            }
            .scoreboard .score {
                font-size: 24px;
                gap: 16px;
            }
            .controls {
                font-size: 11px;
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .game-wrapper {
                padding: 10px;
                border-radius: 12px;
            }
            .scoreboard {
                font-size: 16px;
                padding-bottom: 8px;
            }
            .scoreboard .score {
                font-size: 18px;
                gap: 10px;
            }
            .scoreboard .score span {
                min-width: 30px;
            }
            .controls {
                font-size: 10px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .controls .restart-btn {
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- SCOREBOARD -->
        <div class="scoreboard">
            <div>
                <div class="score-label">Player</div>
                <div class="score"><span id="playerScore">0</span></div>
            </div>
            <div class="divider">|</div>
            <div style="text-align:right;">
                <div class="score-label">AI</div>
                <div class="score"><span id="aiScore">0</span></div>
            </div>
        </div>

        <!-- CANVAS -->
        <canvas id="pongCanvas" width="800" height="450"></canvas>

        <!-- CONTROLS -->
        <div class="controls">
            <span>
                <span class="key">W</span> <span class="key">S</span> &nbsp;move
            </span>
            <button class="restart-btn" id="restartBtn">↻ restart</button>
            <span style="opacity:0.4;">first to 5</span>
        </div>
    </div>

    <script>
        // ============================================================
        //  PONG — full game logic
        // ============================================================

        (function() {

            // ---------- DOM refs ----------
            const canvas = document.getElementById('pongCanvas');
            const ctx = canvas.getContext('2d');
            const playerScoreEl = document.getElementById('playerScore');
            const aiScoreEl = document.getElementById('aiScore');
            const restartBtn = document.getElementById('restartBtn');

            // ---------- Constants ----------
            const W = 800;
            const H = 450;
            const PADDLE_W = 12;
            const PADDLE_H = 90;
            const BALL_SIZE = 12;
            const PLAYER_X = 30;
            const AI_X = W - 30 - PADDLE_W;
            const WIN_SCORE = 5;
            const SPEED_INIT = 4.2;
            const SPEED_INCREMENT = 0.35;
            const MAX_SPEED = 10.0;
            const AI_SPEED = 4.2;
            const AI_REACTION_ZONE = 65; // how far from ball AI starts reacting

            // ---------- State ----------
            let playerY = H / 2 - PADDLE_H / 2;
            let aiY = H / 2 - PADDLE_H / 2;

            let ball = {
                x: W / 2,
                y: H / 2,
                vx: SPEED_INIT * (Math.random() > 0.5 ? 1 : -1),
                vy: (Math.random() - 0.5) * 3.2,
                size: BALL_SIZE,
            };

            let playerScore = 0;
            let aiScore = 0;
            let gameOver = false;
            let winner = null; // 'player' or 'ai'

            // key state
            const keys = {
                w: false,
                s: false,
            };

            // ---------- Helpers ----------
            function resetBall(direction) {
                ball.x = W / 2;
                ball.y = H / 2 + (Math.random() - 0.5) * 60;
                const speed = Math.min(SPEED_INIT + (playerScore + aiScore) * 0.2, MAX_SPEED);
                const angle = (Math.random() - 0.5) * 0.8;
                const sign = direction || (Math.random() > 0.5 ? 1 : -1);
                ball.vx = speed * sign * Math.cos(angle);
                ball.vy = speed * Math.sin(angle);
                // ensure minimum vertical speed
                if (Math.abs(ball.vy) < 1.2) ball.vy = 1.2 * (ball.vy >= 0 ? 1 : -1);
            }

            function resetGame() {
                playerY = H / 2 - PADDLE_H / 2;
                aiY = H / 2 - PADDLE_H / 2;
                playerScore = 0;
                aiScore = 0;
                gameOver = false;
                winner = null;
                updateScoreDisplay();
                resetBall(1);
            }

            function updateScoreDisplay() {
                playerScoreEl.textContent = playerScore;
                aiScoreEl.textContent = aiScore;
            }

            // ---------- Collision: paddle vs ball ----------
            function paddleCollision(px, py, pw, ph, bx, by, br) {
                // closest point on paddle to ball center
                const closestX = Math.max(px, Math.min(bx, px + pw));
                const closestY = Math.max(py, Math.min(by, py + ph));
                const dx = bx - closestX;
                const dy = by - closestY;
                return (dx * dx + dy * dy) < (br * br);
            }

            // ---------- AI logic ----------
            function updateAI() {
                if (gameOver) return;

                const ballY = ball.y;
                const ballVx = ball.vx;

                // Only react if ball is coming toward AI or is close to AI's side
                const ballComingTowardAI = ballVx > 0;
                const ballNearAI = ball.x > W * 0.5;

                if (ballComingTowardAI || ballNearAI) {
                    const targetY = ballY - PADDLE_H / 2;
                    const diff = targetY - aiY;

                    // Add slight imperfection: react with delay / zone
                    const reactionSpeed = AI_SPEED * (1 + Math.random() * 0.1);

                    if (Math.abs(diff) > AI_REACTION_ZONE * 0.3) {
                        aiY += Math.sign(diff) * Math.min(Math.abs(diff), reactionSpeed);
                    } else {
                        // subtle drift back to center
                        const centerDiff = (H / 2 - PADDLE_H / 2) - aiY;
                        aiY += Math.sign(centerDiff) * Math.min(Math.abs(centerDiff), 0.4);
                    }
                } else {
                    // drift back to center slowly
                    const centerDiff = (H / 2 - PADDLE_H / 2) - aiY;
                    aiY += Math.sign(centerDiff) * Math.min(Math.abs(centerDiff), 0.3);
                }

                // Clamp AI
                aiY = Math.max(0, Math.min(H - PADDLE_H, aiY));
            }

            // ---------- Game update ----------
            function update() {
                if (gameOver) return;

                // ----- Player movement -----
                const playerSpeed = 5.5;
                if (keys.w) playerY -= playerSpeed;
                if (keys.s) playerY += playerSpeed;
                playerY = Math.max(0, Math.min(H - PADDLE_H, playerY));

                // ----- AI -----
                updateAI();

                // ----- Ball movement -----
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Wall bounce (top / bottom)
                if (ball.y - ball.size / 2 < 0) {
                    ball.y = ball.size / 2;
                    ball.vy = -ball.vy;
                }
                if (ball.y + ball.size / 2 > H) {
                    ball.y = H - ball.size / 2;
                    ball.vy = -ball.vy;
                }

                // ----- Paddle collisions -----
                const br = ball.size / 2;

                // Player paddle
                if (ball.vx < 0 &&
                    ball.x - br < PLAYER_X + PADDLE_W &&
                    ball.x + br > PLAYER_X &&
                    ball.y > playerY &&
                    ball.y < playerY + PADDLE_H) {

                    // reflect
                    ball.vx = -ball.vx;
                    // add angle based on where on paddle it hit
                    const hitPos = (ball.y - (playerY + PADDLE_H / 2)) / (PADDLE_H / 2);
                    ball.vy = hitPos * 3.8;
                    // speed up slightly
                    const currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    const newSpeed = Math.min(currentSpeed + SPEED_INCREMENT, MAX_SPEED);
                    const angle = Math.atan2(ball.vy, ball.vx);
                    ball.vx = newSpeed * Math.cos(angle);
                    ball.vy = newSpeed * Math.sin(angle);
                    // push out
                    ball.x = PLAYER_X + PADDLE_W + br;
                }

                // AI paddle
                if (ball.vx > 0 &&
                    ball.x + br > AI_X &&
                    ball.x - br < AI_X + PADDLE_W &&
                    ball.y > aiY &&
                    ball.y < aiY + PADDLE_H) {

                    ball.vx = -ball.vx;
                    const hitPos = (ball.y - (aiY + PADDLE_H / 2)) / (PADDLE_H / 2);
                    ball.vy = hitPos * 3.8;
                    const currentSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    const newSpeed = Math.min(currentSpeed + SPEED_INCREMENT, MAX_SPEED);
                    const angle = Math.atan2(ball.vy, ball.vx);
                    ball.vx = newSpeed * Math.cos(angle);
                    ball.vy = newSpeed * Math.sin(angle);
                    ball.x = AI_X - br;
                }

                // ----- Scoring -----
                if (ball.x - br < -10) {
                    // AI scores
                    aiScore++;
                    updateScoreDisplay();
                    if (aiScore >= WIN_SCORE) {
                        gameOver = true;
                        winner = 'ai';
                    } else {
                        resetBall(1);
                    }
                } else if (ball.x + br > W + 10) {
                    // Player scores
                    playerScore++;
                    updateScoreDisplay();
                    if (playerScore >= WIN_SCORE) {
                        gameOver = true;
                        winner = 'player';
                    } else {
                        resetBall(-1);
                    }
                }
            }

            // ---------- Drawing ----------
            function draw() {
                // Clear
                ctx.clearRect(0, 0, W, H);

                // ----- Background subtle grid -----
                ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, H);
                    ctx.stroke();
                }
                for (let i = 0; i < H; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(W, i);
                    ctx.stroke();
                }

                // ----- Center line (dashed) -----
                ctx.setLineDash([12, 18]);
                ctx.strokeStyle = 'rgba(255,255,255,0.07)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(W / 2, 10);
                ctx.lineTo(W / 2, H - 10);
                ctx.stroke();
                ctx.setLineDash([]);

                // ----- Center circle -----
                ctx.beginPath();
                ctx.arc(W / 2, H / 2, 50, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // ----- Player paddle -----
                const gradP = ctx.createLinearGradient(PLAYER_X, 0, PLAYER_X + PADDLE_W, 0);
                gradP.addColorStop(0, '#6ac8ff');
                gradP.addColorStop(1, '#3a9bd5');
                ctx.shadowColor = 'rgba(100, 200, 255, 0.35)';
                ctx.shadowBlur = 18;
                ctx.fillStyle = gradP;
                ctx.beginPath();
                ctx.roundRect(PLAYER_X, playerY, PADDLE_W, PADDLE_H, 6);
                ctx.fill();
                // glow edge
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(PLAYER_X, playerY, PADDLE_W, PADDLE_H, 6);
                ctx.stroke();

                // ----- AI paddle -----
                const gradA = ctx.createLinearGradient(AI_X, 0, AI_X + PADDLE_W, 0);
                gradA.addColorStop(0, '#ff7b6b');
                gradA.addColorStop(1, '#d94f3a');
                ctx.shadowColor = 'rgba(255, 120, 100, 0.3)';
                ctx.shadowBlur = 18;
                ctx.fillStyle = gradA;
                ctx.beginPath();
                ctx.roundRect(AI_X, aiY, PADDLE_W, PADDLE_H, 6);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(AI_X, aiY, PADDLE_W, PADDLE_H, 6);
                ctx.stroke();

                // ----- Ball -----
                const br = ball.size / 2;
                const gradB = ctx.createRadialGradient(
                    ball.x - 3, ball.y - 4, 1,
                    ball.x, ball.y, br + 4
                );
                gradB.addColorStop(0, '#ffffff');
                gradB.addColorStop(0.5, '#d4f0ff');
                gradB.addColorStop(1, '#7ac8f0');
                ctx.shadowColor = 'rgba(150, 220, 255, 0.6)';
                ctx.shadowBlur = 28;
                ctx.fillStyle = gradB;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, br, 0, Math.PI * 2);
                ctx.fill();

                // ball inner glow
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(ball.x - 2, ball.y - 3, br * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // ----- Game Over overlay -----
                if (gameOver) {
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.fillRect(0, 0, W, H);

                    const msg = winner === 'player' ? '🏆 You Win!' : '💻 AI Wins!';
                    const sub = winner === 'player' ? 'perfect game!' : 'better luck next time';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    ctx.shadowColor = winner === 'player' ? 'rgba(100,200,255,0.3)' : 'rgba(255,120,100,0.3)';
                    ctx.shadowBlur = 40;
                    ctx.font = 'bold 58px "Courier New", monospace';
                    ctx.fillStyle = winner === 'player' ? '#b0e8ff' : '#ffb0a0';
                    ctx.fillText(msg, W / 2, H / 2 - 16);

                    ctx.shadowBlur = 0;
                    ctx.font = '18px "Courier New", monospace';
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fillText(sub, W / 2, H / 2 + 50);

                    ctx.font = '14px "Courier New", monospace';
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.fillText('press restart to play again', W / 2, H / 2 + 94);
                }

                // reset shadow
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            // ----- roundRect polyfill for canvas -----
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ---------- Game loop ----------
            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            // ---------- Event listeners ----------
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 's') {
                    e.preventDefault();
                    keys[key] = true;
                }
                // optional: space to restart
                if (key === ' ' || key === 'space') {
                    e.preventDefault();
                    resetGame();
                }
            });

            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 's') {
                    e.preventDefault();
                    keys[key] = false;
                }
            });

            restartBtn.addEventListener('click', resetGame);

            // Prevent context menu on canvas
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // ---------- Start ----------
            resetGame();
            loop();

        })();
    </script>

</body>
</html>
